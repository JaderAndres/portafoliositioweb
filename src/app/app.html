  :host {

    display: block;
    min-height: 100vh;
  }

  .encabezado
  {
    text-align: center;
  }

  p {
    text-align: center;
  }

  main {
    background-color: white;
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: inherit;
    position: relative;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    /* max-width: 700px; */
    /* margin-bottom: 3rem; */
    /* background-color: rgb(245, 245, 245); */
    background-color: wheat;
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
      width: max-content;
    }
  }

  .layout {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  }

  .contenido {
  flex: 1;
  }

  .pie {
  margin-top: auto;
  background: #e5e5e7;
  color: #3a3a3a;
  padding: 2rem 1.5rem 1.25rem;
}

.pie-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 1.5rem;
  align-items: center;
  max-width: 1100px;
  margin: 0 auto;
}

.pie-logos {
  display: flex;
  gap: 1rem;
  align-items: center;
  justify-content: center;
}

.pie-logos img {
  height: 32px;
  width: auto;
  object-fit: contain;
  filter: brightness(0) invert(1); /* opcional: logos blancos sobre fondo oscuro */
  opacity: 0.9;
}

.pie-copy {
  max-width: 1100px;
  margin: 1.5rem auto 0;
  padding-top: 1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  text-align: center;
  font-size: 0.875rem;
  opacity: 0.8;
}

@media (max-width: 700px) {
  .pie-grid {
    grid-template-columns: 1fr;
    text-align: center;
  }
}

</style>
